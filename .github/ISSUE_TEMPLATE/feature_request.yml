name: Feature request
description: Suggest a specific feature or improvement for speeecial.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues before opening a new request.
        You can write in English or Russian. For an early idea you want to
        discuss, use the Question or idea discussion form.
  - type: textarea
    id: problem
    attributes:
      label: What would you like to improve?
      description: Describe your use case and what is missing or difficult today.
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed solution
      description: Describe the feature and how you would use it.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Mention other approaches or workarounds you have considered.
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add examples, screenshots, or links that explain the request.
