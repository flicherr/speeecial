name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    if: github.repository == 'flicherr/speeecial'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      commit: ${{ steps.source.outputs.commit }}
      notes-artifact-id: ${{ steps.notes.outputs.artifact-id }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Validate tag syntax
        id: tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:RELEASE_TAG
          if ($tag -cnotmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
              throw 'Expected an existing stable tag named vX.Y.Z.'
          }
          if ($env:GITHUB_REF -cne "refs/tags/$tag") {
              throw 'Run Release on the matching tag: select that tag in Run workflow, or use gh workflow run release.yml --ref <tag> -f tag=<tag>.'
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$($tag.Substring(1))" >> $env:GITHUB_OUTPUT

      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          persist-credentials: false

      - name: Check source version and extract release notes
        id: source
        env:
          RELEASE_VERSION: ${{ steps.tag.outputs.version }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:RELEASE_VERSION
          $header = Get-Content -LiteralPath src/version.hpp -Raw
          if ($header -cnotmatch '(?m)^#define SPEEECIAL_VERSION "([0-9]+\.[0-9]+\.[0-9]+)"\r?$' -or $Matches[1] -cne $version) {
              throw 'The tag does not match SPEEECIAL_VERSION in src/version.hpp.'
          }
          $commit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $commit -cnotmatch '^[0-9a-f]{40}$') {
              throw 'Cannot resolve the release commit.'
          }
          if ($commit -cne $env:GITHUB_SHA) {
              throw 'The release commit differs from the workflow source. Start a new run on the matching tag.'
          }
          $changelog = Get-Content -LiteralPath CHANGELOG.md -Raw
          $pattern = '(?ms)^## ' + [regex]::Escape($version) + '\r?\n(?<body>.*?)(?=^## |\z)'
          $section = [regex]::Match($changelog, $pattern)
          if (-not $section.Success -or -not $section.Groups['body'].Value.Trim()) {
              throw "Missing CHANGELOG.md section for $version."
          }
          $notes = $section.Groups['body'].Value.Trim()
          $details = [regex]::Match($notes, '(?m)^###[ \t]+Details(?:[ \t]+[^\r\n]*)?\r?$')
          if ($details.Success) {
              $notes = $notes.Substring(0, $details.Index).Trim()
              if (-not $notes) {
                  throw "Empty release notes before '### Details' in CHANGELOG.md section $version. Add a user-facing description before the details heading."
              }
          }
          $changelogUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/blob/$env:RELEASE_TAG/CHANGELOG.md"
          $notes += "`n`n[Full changelog (Russian)]($changelogUrl)`n"
          $notes | Set-Content -LiteralPath "$env:RUNNER_TEMP/release-notes.md" -Encoding utf8NoBOM
          "commit=$commit" >> $env:GITHUB_OUTPUT

      - name: Save release notes
        id: notes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  checks:
    name: Build and test the release commit
    needs: validate
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      ref: ${{ needs.validate.outputs.commit }}
      attest: true

  draft:
    name: Prepare and verify draft release
    needs: [validate, checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      attestations: read
    steps:
      - name: Download tested release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.checks.outputs.artifact-id }}
          merge-multiple: true
          path: release

      - name: Download release notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.validate.outputs.notes-artifact-id }}
          merge-multiple: true
          path: notes

      - name: Create or update draft and verify release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
          BUILT_VERSION: ${{ needs.checks.outputs.version }}
          BUILT_COMMIT: ${{ needs.checks.outputs.commit }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:RELEASE_TAG
          $version = $env:RELEASE_VERSION
          $repository = $env:GITHUB_REPOSITORY
          if ($env:BUILT_VERSION -cne $version -or $env:BUILT_COMMIT -cne $env:RELEASE_COMMIT) {
              throw 'The tested build does not match the validated release source.'
          }
          $tagCommit = gh api "repos/$repository/commits/$tag" --jq '.sha'
          if ($LASTEXITCODE -ne 0 -or $tagCommit -cne $env:RELEASE_COMMIT) {
              throw 'The release tag moved after validation. Start a new run.'
          }

          $assetNames = @('speeecial-windows-x64.exe', "speeecial-$version-windows-x64.zip")
          $downloaded = @(Get-ChildItem -LiteralPath release -Force)
          if ($downloaded.Count -ne $assetNames.Count -or @($downloaded | Where-Object { $_.PSIsContainer -or $_.Name -cnotin $assetNames }).Count) {
              throw 'Expected exactly the EXE and versioned ZIP.'
          }
          $assets = @($assetNames | ForEach-Object {
              $file = Get-Item -LiteralPath "release/$_"
              [pscustomobject]@{
                  Name = $_
                  Path = $file.FullName
                  Size = $file.Length
                  Digest = 'sha256:' + (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              }
          })
          if ($assets[0].Size -lt 1024 -or $assets[0].Size -gt 134217728) {
              throw 'EXE size is outside the updater limits.'
          }
          foreach ($asset in $assets) {
              $attestationVerified = $false
              for ($attempt = 0; $attempt -lt 3; ++$attempt) {
                  gh attestation verify $asset.Path --repo $repository `
                      --signer-workflow "$repository/.github/workflows/build.yml" `
                      --signer-digest $env:RELEASE_COMMIT `
                      --source-digest $env:RELEASE_COMMIT `
                      --source-ref "refs/tags/$tag" --deny-self-hosted-runners
                  if ($LASTEXITCODE -eq 0) {
                      $attestationVerified = $true
                      break
                  }
                  if ($attempt -lt 2) { Start-Sleep -Seconds 5 }
              }
              if (-not $attestationVerified) {
                  throw "Attestation verification failed for $($asset.Name); no release files have been uploaded."
              }
          }

          $headers = @{
              Authorization = "Bearer $env:GH_TOKEN"
              Accept = 'application/vnd.github+json'
              'X-GitHub-Api-Version' = '2022-11-28'
              'Cache-Control' = 'no-cache'
          }
          $endpoint = "$env:GITHUB_API_URL/repos/$repository/releases"
          $title = "speeecial $version"
          $notes = (Get-Content -LiteralPath notes/release-notes.md -Raw).Trim()
          if (-not $notes) { throw 'Release notes are empty; the draft will not be changed.' }

          function Assert-Draft($release) {
              if (-not $release -or "$($release.id)" -cnotmatch '^[1-9][0-9]*$' -or $release.tag_name -cne $tag) {
                  throw "Unexpected release response: id=$($release.id), tag=$($release.tag_name); expected $tag."
              }
              if (-not $release.draft) { throw 'This release is already published; it will not be changed.' }
              if ($release.prerelease) { throw 'Expected a stable draft release, not a prerelease.' }
              if (@($release.assets | Where-Object { $_.name -cnotin $assetNames }).Count) {
                  throw 'The existing draft contains unexpected assets. Review it before retrying.'
              }
          }

          function Read-Release {
              $problem = 'empty response'
              for ($attempt = 0; $attempt -lt 6; ++$attempt) {
                  try {
                      $candidate = Invoke-RestMethod -Uri "$endpoint/$releaseId" -Headers $headers
                      if ($candidate -and "$($candidate.id)" -ceq "$releaseId") { return $candidate }
                      $problem = "unexpected response: id=$($candidate.id), tag=$($candidate.tag_name)"
                  } catch {
                      $status = [int]$_.Exception.Response.StatusCode
                      $problem = $_.Exception.Message
                      if ($status -and $status -notin @(404, 429) -and $status -lt 500) {
                          throw "Cannot read release ${releaseId}: $problem"
                      }
                  }
                  if ($attempt -lt 5) {
                      Write-Host "Retrying release ${releaseId}: $problem"
                      Start-Sleep -Seconds 3
                  }
              }
              throw "Cannot read release $releaseId after 6 attempts: $problem"
          }

          # Find an existing release once. After creation, use the POST response
          # ID instead of waiting for the new draft to appear in this listing.
          $matching = @()
          $page = 1
          do {
              $items = Invoke-RestMethod -Uri "${endpoint}?per_page=100&page=$page" -Headers $headers
              $matching += @($items | Where-Object { $_.tag_name -ceq $tag })
              ++$page
          } while (@($items).Count -eq 100)
          if ($matching.Count -gt 1) { throw 'Multiple releases use this tag. Review them before retrying.' }
          $release = if ($matching.Count) { $matching[0] } else { $null }
          if (-not $release) {
              $payload = @{ tag_name = $tag; target_commitish = $env:RELEASE_COMMIT; name = $title; body = $notes; draft = $true; prerelease = $false } | ConvertTo-Json
              $release = Invoke-RestMethod -Method Post -Uri $endpoint -Headers $headers -ContentType 'application/json; charset=utf-8' -Body $payload
          }
          Assert-Draft $release
          $releaseId = $release.id

          $release = Read-Release
          Assert-Draft $release
          if ($release.name -cne $title -or $release.body -cne $notes) {
              # Do not send draft=true in PATCH: a concurrent publication must
              # never be reverted to a draft by this workflow.
              $payload = @{ name = $title; body = $notes } | ConvertTo-Json
              $release = Invoke-RestMethod -Method Patch -Uri "$endpoint/$releaseId" -Headers $headers -ContentType 'application/json; charset=utf-8' -Body $payload
              Assert-Draft $release
          }

          foreach ($asset in $assets) {
              $release = Read-Release
              Assert-Draft $release
              $existing = @($release.assets | Where-Object { $_.name -ceq $asset.Name })
              if ($existing.Count -gt 1) { throw "Duplicate draft asset $($asset.Name). Review the draft before retrying." }
              if ($existing.Count) {
                  if ($existing[0].state -ceq 'uploaded' -and $existing[0].size -eq $asset.Size -and $existing[0].digest -ceq $asset.Digest) {
                      continue
                  }
                  Write-Host "Replacing draft asset $($asset.Name)."
                  Invoke-RestMethod -Method Delete -Uri "$endpoint/assets/$($existing[0].id)" -Headers $headers | Out-Null
                  $release = Read-Release
                  Assert-Draft $release
              }
              $uploadBase = $release.upload_url -replace '\{\?name,label\}$', ''
              if ($uploadBase -cne "https://uploads.github.com/repos/$repository/releases/$releaseId/assets") {
                  throw "Unexpected upload URL for release ${releaseId}: $uploadBase"
              }
              $uploadUrl = $uploadBase + '?name=' + [uri]::EscapeDataString($asset.Name)
              try {
                  Invoke-RestMethod -Method Post -Uri $uploadUrl -Headers $headers -ContentType 'application/octet-stream' -InFile $asset.Path | Out-Null
              } catch {
                  throw "Cannot upload $($asset.Name) to draft release ${releaseId}: $($_.Exception.Message)"
              }
          }

          $verified = $false
          for ($attempt = 0; $attempt -lt 6; ++$attempt) {
              $release = Read-Release
              Assert-Draft $release
              $problems = @()
              if ($release.name -cne $title -or $release.body -cne $notes) { $problems += 'Title or release notes differ.' }
              if (@($release.assets).Count -ne $assetNames.Count) { $problems += 'Expected exactly the EXE and ZIP.' }
              $tagPage = "$env:GITHUB_SERVER_URL/$repository/releases/tag/"
              $draftPagePattern = '^' + [regex]::Escape($tagPage) + 'untagged-[0-9a-f]+$'
              if ($release.html_url -cne "$tagPage$tag" -and $release.html_url -cnotmatch $draftPagePattern) {
                  throw "Unexpected draft URL for release ${releaseId}: $($release.html_url)"
              }
              foreach ($asset in $assets) {
                  $remote = @($release.assets | Where-Object { $_.name -ceq $asset.Name })
                  # Draft browser URLs can use untagged-* until publication.
                  $urls = @(
                      "$env:GITHUB_SERVER_URL/$repository/releases/download/$tag/$($asset.Name)"
                      ($release.html_url -creplace '/releases/tag/', '/releases/download/') + '/' + $asset.Name
                  )
                  if ($remote.Count -ne 1 -or $remote[0].state -cne 'uploaded' -or $remote[0].size -ne $asset.Size -or $remote[0].digest -cne $asset.Digest -or $remote[0].browser_download_url -cnotin $urls) {
                      $problems += "Asset $($asset.Name) differs: matches=$($remote.Count), state=$($remote.state), size=$($remote.size), digest=$($remote.digest), URL=$($remote.browser_download_url)."
                  }
              }
              $verified = $problems.Count -eq 0
              if ($verified) { break }
              if ($attempt -lt 5) { Start-Sleep -Seconds 5 }
          }
          if (-not $verified) { throw "Draft release $releaseId verification failed; it remains unpublished. $($problems -join ' ')" }
          @(
              "Draft release: [$tag]($($release.html_url))"
              ""
              "Source commit: $env:RELEASE_COMMIT"
              ""
              'Windows Release x64, core/update/menu/updater tests and Linux core/update tests passed.'
              'Asset sizes, URLs and GitHub API SHA-256 digests match the tested build.'
              'Both files have verified build provenance from the release tag and commit.'
              'Run the manual Windows graphics checks before publishing this draft.'
          ) >> $env:GITHUB_STEP_SUMMARY
